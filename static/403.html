<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>权限不足</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
      }
      .content {
        text-align: center;
      }
      h1,
      p {
        margin: 0.5rem 0;
      }
      a {
        color: #007bff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>403 - 暂无权限访问</h1>
      <p>对不起，您没有权限访问您所请求的页面。</p>
      <p>如果您认为这是一个错误，请联系网站管理员。</p>
    </div>
  </body>
</html>
