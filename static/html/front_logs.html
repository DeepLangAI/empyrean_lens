        /* 确保首列和表头首列的样式一致，保留冻结效果 */
        .sticky-table thead th.sticky-column {
            z-index: 3;
            background: linear-gradient(to bottom, #f8f8f8, #e0e0e0); /* 确保表头固定列颜色一致 */

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 60px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 5px;
            position: absolute;
            z-index: 5;
            bottom: 125%; /* 调整 tooltip 的位置 */
            left: 50%;
            margin-left: -30px; /* 使 tooltip 居中 */
            opacity: 0;
            transition: opacity 0.3s;
            font-size: x-small;
        }

        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%; /* 三角形位置 */
            left: 50%;
            margin-left: -5px; /* 居中三角形 */
            border-width: 5px;
            border-style: solid;
            border-color: black transparent transparent transparent; /* 三角形颜色 */
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /*下拉expander*/
        .expander {

        .expander-header .copy-btn {

        }

        .expander-header:hover {

        }
        /* 添加 hover 效果，仅作用于 h3 */
        .expander-header:hover h3 {
            color: #f6891c; /* 更改文字颜色 */
        }
        .expander-header h3 {
            margin: 0;
        }
        .expander iframe {
            width: 100%;
            height: 50vh;
        }
        .expander-header:after {
            content: '▼';
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        .expander.active .expander-header:after {
            transform: rotate(180deg);
        }
        .expander-content {
            display: none;
            padding: 10px;
            transition: all 0.3s ease;
            max-height: 0;
            overflow: hidden;
        }
        .expander.active .expander-content {
            display: block;
            max-height: 500px;
            overflow: auto;
        }

            border-radius: 12px;
        }
        .modal-header{
            background-color: #fefefe;
            /*padding: 20px;*/
            /*border: 1px solid #888;*/
            animation: scaleIn 0.5s ease-in-out;
            transform-origin: center center;
            max-height: 70vh;
            overflow-y: scroll;
        }
        .modal-header h2{
            display: contents;
        }
        .modal-body{
            overflow: scroll;
            max-height: inherit;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        /* 动画 */
        /*@keyframes scaleIn {*/
        /*    0% { transform: scale(0); }*/
        /*    100% { transform: scale(1); }*/
        /*}*/
        @keyframes scaleIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
                animation-timing-function: ease-out;
            }
            40% {
                transform: scale(1.02);
                opacity: 1;
                animation-timing-function: ease-out;
            }
            100% {
                transform: scale(1);
                opacity: 1;
                animation-timing-function: ease-out;
            }
        }

        /*.selector-group{*/
        /*    display: flex;*/
        /*}*/
        /*.selector{*/

        /*}*/
        .selector-group {
            display: flex;
            align-items: center; /* 垂直居中对齐 */
            gap: 10px; /* 增加选择器和标签之间的间距 */
        }

        .selector-group div {
            font-size: 16px; /* 设置标签的字体大小 */
            color: #333; /* 标签颜色 */
        }

        .selector {
            padding: 8px 12px; /* 内边距，增加选择器的点击区域 */
            border: 1px solid #ccc; /* 边框颜色 */
            border-radius: 4px; /* 边框圆角 */
            background-color: #f9f9f9; /* 背景颜色 */
            font-size: 14px; /* 字体大小 */
            transition: border-color 0.3s ease; /* 平滑过渡效果 */
        }

        .selector:focus {
            border-color: #00722d; /* 聚焦时改变边框颜色 */
            outline: none; /* 去掉默认的聚焦轮廓 */
        }

        .selector option {
            padding: 10px; /* 选项内边距 */
        }


    </style>
</head>
<body>

<nav>
    <a href="/api/log/overview">语鲸稳定性一览</a>
    <a href="/api/log/tools">高效工具箱</a>
    <a href="/public/html/link_trace.html">链路追踪</a>
    <a href="/public/html/front_logs.html" class="active">用户侧异常</a>
</nav>

<div id="app"></div>
<div id="loading-container" class="loading-container">
    <div class="loading-spinner"></div>
</div>

<script>

    // 显示加载状态
    function showLoadingStatus() {
        $('#loading-container').removeClass('hide');
    }

    // 隐藏加载状态
    function hideLoadingStatus() {
        $('#loading-container').addClass('hide');
    }


    function groupLogsBy(logs, by){
        let groupedLogs = {};
        logs.forEach(log => {
            let key = log[by];
            if (!groupedLogs[key]) {
                groupedLogs[key] = [];
            }
            groupedLogs[key].push(log);
        });
        // 转化为数组，按value长度排序，从大到小
        let sortedLogs = Object
            .entries(groupedLogs)
            .sort((a, b) => b[1].length - a[1].length);
        return sortedLogs
    }


    $(document).ready(function() {
        let modalStack = []
        let keyToReadable = {
            'ip_region': 'IP属地',
            'user_id': '用户ID',
            'failure_reason': '失败原因',
            'time': '时间',
            'file_name': '文件名',
            'file_type': '文件类型',
            'file_size': '文件大小',
            'date': '日期',
        }
        let readableToKey = {}
        for (let key in keyToReadable) {
            readableToKey[keyToReadable[key]] = key
        }

        $(document).on('keydown', function(event) {
            if (event.key === 'Escape') {
                handleClickModalClose();
            }
        });
        function handleClickOutsideModal(event){
            // 检查点击的目标是否是模态框（$modal）而不是模态框内容（$modalContent）
            if ($(event.target).is('.modal.active') && !$(event.target).find('.modal-content').is(event.target)) {
                handleClickModalClose(); // 调用关闭模态框的函数
            }
        }
        function handleClickModalClose() {
            removeLastModal()
            showLastModal()
        };

        function showLastModal(){
            if (modalStack.length > 0) {
                let $modal = modalStack[modalStack.length - 1]
                $modal.addClass('active')
                $modal.show()
                console.log("showLastModal", modalStack.length, $modal)
            }
            // $modal.fadeIn(300, function() {
            //     // 添加active class
            //     $modal.addClass('active')
            // })
        }

        function hideLastModal(){
            let $modal = modalStack[modalStack.length - 1]
            $modal.removeClass('active')
            // $modal.fadeOut(300, function() {
            //     // 删除active class
            //     $modal.removeClass('active')
            // })
        }
        function removeLastModal(){
            if (modalStack.length > 0){
                let $modal = modalStack.pop()
                $modal.remove()
            }
        }
        function pushModal($modal){
            $('#app').append($modal)
            modalStack.push($modal)
            $modal.addClass('active')
        }

        function showErrorLogDetail(title, logs){
            let $modal = $('<div>').addClass('modal active').click(handleClickOutsideModal)
            let $header = $('<div>').addClass('modal-header')
            let $body = $('<div>').addClass('modal-body')
            let $modalContent = $('<div>').addClass('modal-content')
            let $closeBtn = $('<span>').addClass('close-button').text('x')
            $closeBtn.on('click', handleClickModalClose)
            $header.append(
                $('<h2>').text(title),
                $closeBtn,
            )
            let keys = Object.keys(logs[0])
            // keys按照如下顺序排序
            let order = ['date', 'time', 'user_id', 'failure_reason', 'ip', 'ip_region']
            // 未来的key按照字母顺序排序
            if (keys.includes('date') && keys.includes('time')) {
                // remove date
                keys.splice(keys.indexOf('date'), 1)
            }
            if (keys.includes('failure_reason')) {
                // remove failure_reason
                keys.splice(keys.indexOf('failure_reason'), 1)
            }
            keys.sort((a, b) => {
                if (order.includes(a) && order.includes(b)) {
                    return order.indexOf(a) - order.indexOf(b)
                }
                if (order.includes(a)) {
                    return -1
                }
                if (order.includes(b)) {
                    return 1
                }
                return a.localeCompare(b)
            })
            let $table = $('<table>')
            let $thead = $('<thead>')
            let $tbody = $('<tbody>')
            $thead.append(
                $('<tr>').append(keys.map(key => $('<th>').text(keyToReadable[key] || key)))
            )
            for (let i = 0; i < logs.length; i++) {
                let log = logs[i];
                let $tr = $('<tr>')
                for (let j = 0; j < keys.length; j++) {
                    let key = keys[j];
                    let $td = $('<td>').text(log[key])
                    if (['ip_region', 'failure_reason'].includes(key)){
                        $td.css({
                            'white-space': 'nowrap',
                        })
                    }
                    $tr.append($td)
                }
                $tbody.append($tr)
            }
            $table.append($thead).append($tbody)
            $body.append($table)
            $modalContent.append($header, $body)
            $modal.append($modalContent)
            pushModal($modal)
        }

        function createErrorGroup(date, errorLogs){
            function showGroupedAnlz(key){
                // key = keyToReadable[key] || key
                let groupedLogs = groupLogsBy(errorLogs, key)
                let $table = $('<table>')
                let $thead = $('<thead>')
                $thead.append(
                    $('<tr>')
                        .append($('<th>').text(keyToReadable[key] || key))
                        .append($('<th>').text('次数'))
                )
                let $tbody = $('<tbody>')
                for (let i = 0; i < groupedLogs.length; i++) {
                    let group = groupedLogs[i];
                    let value = group[0]
                    let count = group[1].length
                    let $tr = $('<tr>')
                    $tr.append($('<td>').text(value))
                    $tr.append($('<td>')
                        .text(count)
                        .addClass('clickable')
                        .click(function (){
                            hideLastModal()
                            showErrorLogDetail(date + '异常详情：' + group[0], group[1])
                        }))
                    $tbody.append($tr)
                }
                $table.append($thead, $tbody)
                $tableContainer.empty()
                $tableContainer.append($table)
            }
            let $container = $('<div>')
            let $selectorGroup = $('<div>').addClass('selector-group')
            let $selector = $('<select>').addClass('selector')
            $selectorGroup.append(
                $('<div>').text('聚合依据'),
                $selector
            )
            let $tableContainer = $('<div>').addClass('table-container')
            $container.append($selectorGroup, $tableContainer)

            let keys = Object.keys(errorLogs[0])
            let skipKeys = ['time', 'date', 'trace_id', 'file_size', 'file_type']
            keys = keys.filter(key => !skipKeys.includes(key))

            let key = 'failure_reason'
            keys.forEach(key => {
                $selector.append($('<option>').text(keyToReadable[key] || key).attr('value', key))
            })
            $selector.val(key)
            $selector.change(function() {
                key = $(this).val()
                showGroupedAnlz(key)
            })
            showGroupedAnlz(key)
            return $container
        }

        function createErrorGenerateModal(date){
            let $app = $('#app')
            let $modal = $('<div>').addClass('modal active').click(handleClickOutsideModal)
            let $header = $('<div>').addClass('modal-header')
            let $body = $('<div>').addClass('modal-body')
            let $closeBtn = $('<span>')
                .addClass('close-button')
                .text('x')
                .click(handleClickModalClose)
            $header.append(
                $('<h2>').text(date + '生成错误一览'),
                $closeBtn
            )
            $body.append(
            )
            let $modalContent = $('<div>').addClass('modal-content').append(
                $header,
                $body
            )
            $modal.append($modalContent)
            $app.append($modal)
            modalStack.push($modal)
            showLoadingStatus()
            axios.get('/api/v1/front_err/generate/list', {
                params: {
                    date: date,
                }
            }).then(response => {
                let data = response.data.data
                let $container = createErrorGroup(date, data)
                $body.append($container)
            }).catch(error => {

            }).finally(() => {
                hideLoadingStatus()
            })
            console.log('createErrorGenerateModal')
        }

        function createErrorUploadModal(date){
            let $app = $('#app')
            let $modal = $('<div>').addClass('modal active').click(handleClickOutsideModal)
            let $header = $('<div>').addClass('modal-header')
            let $body = $('<div>').addClass('modal-body')
            let $closeBtn = $('<span>')
                .addClass('close-button')
                .text('x')
                .click(handleClickModalClose)
            $header.append(
                $('<h2>').text(date + '上传错误一览'),
                $closeBtn,
            )
            $body.append(
            )
            let $modalContent = $('<div>').addClass('modal-content').append(
                $header,
                $body,
            )
            $modal.append($modalContent)
            $app.append($modal)
            modalStack.push($modal)
            showLoadingStatus()
            axios.get('/api/v1/front_err/upload/list', {
                params: {
                    date: date,
                }
            }).then(response => {
                let data = response.data.data
                let $container = createErrorGroup(date, data)
                $modalContent.append($container)
            }).catch(error => {

            }).finally(() => {
                hideLoadingStatus()
            })
            console.log('createErrorUploadModal')
        }

        function main(){
            let $app = $('#app')
            let $tableContainer = $('<div>').addClass('table-container')
            let $table = $('<table>')
            $tableContainer.append($('<h1>').text('用户侧错误一览'), $table)
            let $thead = $('<thead>')
            let $tbody = $('<tbody>')
            $thead.append(
                $('<tr>')
                    .append($('<th>').text('日期'))
                    .append($('<th>').text('生成错误数'))
                    .append($('<th>').text('上传错误数'))
            )
            showLoadingStatus()
            axios.get('/api/v1/front_err/list', {
                params: {

                }
            }).then(response => {
                let data = response.data.data
                console.log(data)
                for (let i = 0; i < data.length; i++) {
                    let row = data[i]
                    let $tr = $('<tr>')
                    let $date = $('<td>').text(row.date)
                    let $num_error_generate = $('<td>').text(row.num_error_generate)
                    let $num_error_upload = $('<td>').text(row.num_error_upload)
                    $tr.append($date, $num_error_generate, $num_error_upload)
                    if (row.num_error_generate > 0){
                        $num_error_generate.addClass('clickable')
                        $num_error_generate.click(function (){
                            createErrorGenerateModal(row.date)
                        })
                    }

                    if (row.num_error_upload > 0){
                        $num_error_upload.addClass('clickable')
                        $num_error_upload.click(function (){
                            createErrorUploadModal(row.date)
                        })
                    }
                    $tbody.append($tr)
                }
                $table.append($thead)
                $table.append($tbody)
                $app.append($tableContainer)
            }).catch(error => {

            }).finally(() => {
                hideLoadingStatus()
            })

        }
        main()
    })

</script>
</body>
</html>
