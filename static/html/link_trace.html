        .loading-container {
            position: fixed;

        .loading-container.hide {
            opacity: 0;

        }

        .loading-spinner {
            border: 4px solid #333;

            height: 30px;

            z-index: 9999;

        @keyframes spin {
            from { transform: rotate(0deg); }

        .sticky-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;

            border-radius: 8px; /* 添加圆角 */
            /*box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); !* 添加阴影效果 *!*/
        }

        .sticky-table th {
            background: linear-gradient(to bottom, #f8f8f8, #e0e0e0);
            position: sticky;
            top: 0;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            /*word-wrap: break-word; !* 允许单词折行 *!*/
            white-space: nowrap; /* 允许文本换行 */
            max-width: 150px; /* 设置最大宽度 */
            border-right: 1px solid #ddd; /* 添加右边框 */
        }

        .sticky-table th:last-child,
        .sticky-table td:last-child {
            border-right: none; /* 移除最后一列的右边框 */
        }

        .sticky-table td {
            /*padding: 12px; !* 增加内边距以提升舒适度 *!*/
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 3px;
            padding-right: 3px;

            border-bottom: 1px solid #ddd;
            text-align: center;
            /*text-align: left;*/
            font-size: 14px; /* 提高可读性 */
            color: #333; /* 现代化的深灰色字体 */
            border-right: 1px solid #ddd; /* 添加右边框 */
            white-space: nowrap;
        }

        .sticky-table thead th {
            background: linear-gradient(to bottom, #f8f8f8, #e0e0e0); /* 使用渐变色增强视觉效果 */
            position: sticky;
            top: 0;
            z-index: 2;
            text-transform: uppercase; /* 添加大写字母样式 */
            letter-spacing: 0.05em; /* 增加字母间距 */
            font-weight: 600; /* 加粗字体 */
        }

        .table-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #444; /* 深灰色的标题色 */
        }

        .sticky-column {
            position: sticky;
            left: 0;
            z-index: 1;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05); /* 修改阴影效果为更柔和的样式 */
            border-right: 1px solid #ddd; /* 添加边框以增强视觉分隔 */
        }

        /* 确保首列和表头首列的样式一致，保留冻结效果 */
        .sticky-table thead th.sticky-column {
            z-index: 3;
            background: linear-gradient(to bottom, #f8f8f8, #e0e0e0); /* 确保表头固定列颜色一致 */
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1); /* 添加阴影效果 */
        }

        .sticky-table tbody tr:nth-child(even) {
            background-color: #f7f9fc; /* 更柔和的蓝色背景 */
        }

        .sticky-table tbody tr:hover {
            background-color: #e2e6ea; /* 提供悬停效果的颜色变化 */
            transition: background-color 0.3s ease; /* 增加平滑的过渡效果 */
        }

        /* 确保固定列的背景色与行的背景色一致，并且完全不透明 */
        .sticky-table tbody tr td.sticky-column {
            position: sticky;
            left: 0;
            z-index: 1;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05); /* 为固定列添加轻微的阴影效果 */
            border-right: 1px solid #ddd; /* 增加边框分隔效果 */
        }

        .sticky-table tbody tr:nth-child(even) td.sticky-column {
            background-color: #f7f9fc; /* 与其他偶数行颜色保持一致 */
        }

        .sticky-table tbody tr:hover td.sticky-column {
            background-color: #e2e6ea; /* 与悬停行颜色一致 */
            transition: background-color 0.3s ease; /* 添加过渡效果 */
        }

    function reformatJsonStr(jsonStr){
        try{
            let jsonObj = JSON.parse(jsonStr)
            // 如果是数组，则将数组中的每个元素都parse
            if (Array.isArray(jsonObj)){
                for (let i = 0; i < jsonObj.length; i++){
                    try {
                        jsonObj[i] = JSON.parse(jsonObj[i])
                    } catch (e) {
                        // do nothing
                    }
                }
            }
            return JSON.stringify(jsonObj, null, 4)
        } catch (e) {
            return jsonStr.trim()
        }
        try {
            var jsonStr = JSON.stringify(JSON.parse(jsonStr), null, 4)
        } catch (e) {
            // 分别提取出json内容和非json内容，有可能在{}中，也有可能是[]中
            var jsonContent = jsonStr.match(/({.*})/g)
            if (jsonContent){
                try {
                    var jsonStr = JSON.stringify(JSON.parse(jsonContent[0]), null, 4)
                } catch (e) {
                    var jsonStr = jsonStr
                }
            }else{
                jsonContent = jsonStr.match(/(\[.*\])/g)
                if (jsonContent){
                    try {
                        var jsonStr = JSON.stringify(JSON.parse(jsonContent[0]), null, 4)
                    } catch (e) {
                        var jsonStr = jsonStr
                    }
                }else{
                    var jsonStr = value
                }
            }
        }
        jsonStr = jsonStr.trim()
        return jsonStr
    }

    function duration(start, end){
        // start: 2024-10-28 20:29:18
        // end: 2024-10-28 20:29:19
        // 计算时间差，单位为秒
        var start = new Date(start);
        var end = new Date(end);
        var duration = (end - start);
        if (duration >= 1000) {
            return (duration/1000).toFixed() + '秒'
        }
        return duration.toFixed() + '毫秒'
    }

        // 转换为层次结构的函数
        function buildHierarchy(graphData, rootName='用户上传') {
            const map = {};
            graphData.nodes.forEach(node => {
                map[node.id] = { ...node, children: []}; // 初始化每个节点
            });

            const root = { name: rootName, children: [] }; // 创建一个虚拟根节点

            graphData.nodes.forEach(node => {
                if (graphData.edges[node.id]) {
                    graphData.edges[node.id].forEach(childId => {
                        if (map[childId]) {
                            map[node.id].children.push(map[childId]); // 添加子节点
                        }
                    });
                }
                // 将没有父节点的节点添加到根节点
                if (!Object.values(graphData.edges).flat().includes(node.id)) {
                    root.children.push(map[node.id]);
                }
            });

            return root;
        }

        // 创建树形图的函数
        function createTreeDiagram(graphData, rootName='用户上传', titles=[], docInfo=null) {
            function nameWidth(name){
                if (!name){
                    return 0
                }
                // 判断名字中有多少英文字符、数字、下划线
                let count = 0;
                for (let i = 0; i < name.length; i++) {
                    if ((name.charCodeAt(i) >= 65 && name.charCodeAt(i) <= 90) || (name.charCodeAt(i) >= 97 && name.charCodeAt(i) <= 122) || (name.charCodeAt(i) >= 48 && name.charCodeAt(i) <= 57) || name.charCodeAt(i) == 95) {
                        count++;
                    }
                }
                console.log(name, name.length, count)
                return name.length - count / 2
            }
            function calculateDepth(data){
                let ans = 1
                let depths = []
                for (let i = 0; i < data.children.length; i++){
                    depths.push(calculateDepth(data.children[i]))
                }
                if (depths.length > 0){
                    ans += Math.max(...depths)
                }
                return ans
            }

            function calculateWidth(data){
                let ans = 0
                if (data.children.length >= 2){
                    ans += data.children.length
                }
                for (let i = 0; i < data.children.length; i++){
                    ans += calculateWidth(data.children[i])
                }
                return ans
            }
            const data = buildHierarchy(graphData, rootName);
            console.log(graphData, data)

            // 设置图表尺寸
            const margin = { top: 20, right: 20, bottom: 30, left: 20 };

            // 计算需要的宽度，假设每个节点宽度为 50px
            const nodeWidth = 210;
            const maxWidth = calculateWidth(data) + 1
            const maxDepth = calculateDepth(data)

            // 创建一个新的 div 作为 SVG 的容器
            let svgContainer = $('<div>').css({
                'width': Math.max((maxWidth) * nodeWidth + margin.left + margin.right, 400), // 计算宽度
                'height': maxDepth * 60 + margin.top + margin.bottom, // 可以根据需要调整高度
                'position': 'relative',
            });
            // 获取容器的宽高
            const width = svgContainer.width() - margin.left - margin.right;
            const height = svgContainer.height() - margin.top - margin.bottom;
            // 放置各title，均匀分布
            const titlesContainer = $('<div>').css({
                'position': 'absolute',
                'top': 0,
                'left': 0,
                'width': '100%',
                'height': '100%',
                'pointer-events': 'none',
            });
            for (let i = 0; i < titles.length; i++){
                const title = $('<div>').text(titles[i]).css({
                    'position': 'absolute',
                    'top': margin.top + 5,
                    'left': (i + 1) * (width) / (titles.length + 1) + margin.left,
                    'text-align': 'center',
                    'pointer-events': 'none',
                    'white-space': 'nowrap',
                    'overflow': 'hidden',
                    'text-overflow': 'ellipsis',
                    'font-size': '14px',
                    'font-weight': 'bold',
                    'color': '#333',
                    'text-shadow': '1px 1px 1px rgba(0, 0, 0, 0.1)',
                    'background-color': 'rgba(255, 255, 255, 0.8)',
                    'padding': '5px',
                    'border-radius': '5px',
                    'transform': 'translateX(-50%)',
                })
                titlesContainer.append(title);
            }
            svgContainer.append(titlesContainer);


            // 创建SVG
            const svg = d3.select(svgContainer[0])
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // 添加边框
            svg.append("rect")
                .attr("width", width)
                .attr("height", height)
                .style("stroke", "black")
                .style("fill", "none")
                .style("stroke-width", 1)
                .style("stroke-dasharray", "5,5")
                .attr("transform", `translate(${-margin.left},${-margin.top})`)
                .attr("rx", 5)
                .attr("ry", 5);

            // 创建树形布局
            const tree = d3.tree()
                .size([width - margin.left - margin.right, height - margin.top - margin.bottom])
                .separation((a, b) => (a.parent == b.parent ? 0.9 : 1.2));

            // 创建层次结构
            const root = d3.hierarchy(data);

            // 分配树形布局到数据
            tree(root);

            // // 添加连接线
            // svg.selectAll(".link")
            //     .data(root.links())
            //     .enter().append("path")
            //     .attr("class", "link")
            //     .attr("d", d3.linkVertical()
            //         .x(d => d.x)
            //         .y(d => d.y-15))
            // 添加连接线和箭头
            const links = svg.selectAll(".link")
                .data(root.links())

                .attr("class", "link");

                            return d.y
                        }
                        return d.y-25
                    }))
                .style("fill", "none")
                .style("stroke", "#000");

            // 绘制箭头
            links.append("polygon")
                .attr("points", (d) => {
                    const x1 = d.target.x; // 目标节点的 x 坐标
                    const y1 = d.target.y; // 目标节点的 y 坐标
                    const x2 = d.source.x; // 源节点的 x 坐标
                    const y2 = d.source.y; // 源节点的 y 坐标

                    // 计算箭头坐标
                    const arrowLength = 8; // 箭头长度
                    const arrowWidth = 5; // 箭头宽度

                    const arrowX = x1; // 箭头的 x 坐标
                    const arrowY = y1 - 10; // 箭头的 y 坐标（上方）

                    return `
                ${arrowX},${arrowY}
                ${arrowX - arrowLength * Math.cos(Math.PI / 3)},${arrowY - arrowLength * Math.sin(Math.PI / 3)}
                ${arrowX + arrowLength * Math.cos(Math.PI / 3)},${arrowY - arrowLength * Math.sin(Math.PI / 3)}
            `;

                .on("mousemove", function(event) {
                    tooltip.style("top", (event.pageY - 10) + "px")
                        .style("left", (event.pageX + 10) + "px");
                })
                .on("mouseout", function() {
                    tooltip.style("visibility", "hidden");
                    // 移除节点边框
                    d3.select(this).select("rect")
                        .style("stroke-width", 0);
                })
                .on('click', function (event, d){
                    CreateNodeApiLogsPage(d.data.entry_id, d.data.entry_type, d.data.type, d.data.name, docInfo)
                });


            // 为节点添加长方形
            node.append("rect")
                // .attr("width", d => Math.max((nameWidth(d.data.name)) * 12, 60))
                .attr("width", nodeWidth + 10)
                .attr("height", 35) // 减小高度
                // .attr("x", d => -Math.max(nameWidth(d.data.name) * 12, 60) / 2)
                .attr("x", -nodeWidth / 2 - 5)
                .attr("y", -12.5)
                .attr("rx", 5)
                .style("stroke-width", 0)
                .attr("ry", 5);

            // 为节点添加文本（节点名称）
            node.append("text")
                .attr("dy", "0.35em")
                .attr("text-anchor", "middle")
                .attr("y", 5)
                .text(d => d.data.name);

            // 为节点添加文本（创建时间）
            node.append("text")
                .attr("dy", "0.35em")
                .attr("text-anchor", "end") // 右对齐
                // .attr("x", d => -(nameWidth(d.data.name)) * 12) // 左侧偏移
                .attr("y", -20)
                .text(d => (d.data.finish_time || "").slice(10)); // 显示 create_time 字段

            node.select("rect")
                .attr("fill", (d, i) => {
                    return COLORS[d.data.status] || "#fff"
                });
            return svgContainer
        }

        function renderNodeApiLogs(data, nodeName){
            let $page = $('<div>').addClass('page-body');
            let logs = data.logs
            let $logs = $('<div>').addClass('logs');
            for (let i = 0; i < logs.length; i++)  {
                let log = logs[i];
                let logContainer = $('<div>').addClass('log-container')
                let logId = $('<div>').addClass('log-id').text(i + 1)
                let logTime = $('<div>').addClass('log-time').text(log.enter_time.slice(10, 19))
                let logDetails = $('<div>').addClass('log-details')
                let logDetailsHeader = $('<div>').addClass('log-details-header');
                let logDetailsBody = $('<div>').addClass('log-details-body');

                let keysInHeader = ["http_code", "enter_time", "finish_time"]
                for (var key in log){
                    const id = key +'-' + i;
                    let value = log[key]
                    if (!value){
                        continue
                    }
                    if (keysInHeader.includes(key)){
                        logDetailsHeader.append(
                            $("<span>")
                                .attr("data-field-name", key)
                                .text(log[key])
                        );
                        continue
                    }

                    var span = $('<span>')
                        .addClass('expand-tip')
                        .click(function(e) {
                            e.stopPropagation(); // 阻止事件冒泡，避免触发 p 的点击事件
                            handleClickExpand(id)
                        })
                    if (key == 'input' || key == 'output'){
                        // 格式化json字符串，需要先loads再dumps
                        let jsonStr = reformatJsonStr(value)

                        var p = $('<p class="expanded">')
                            .attr('id', id)
                            .append($("<span>").text(key + ":"))
                            .append($('<pre class="expanded">').append($('<code class="json">').text(jsonStr)))
                        span.text('收起')
                        p.append(span)
                    } else{
                        var p = $('<p>')
                            .attr('id', id)
                            .append($("<span>").text(key + ":"))
                            .append(log[key])
                        if(log[key].length >= 150){
                            span.text('展开')
                            p.append(span)
                        }
                    }

                    logDetailsBody.append(p)
                }
                logDetails.append(logDetailsHeader, logDetailsBody)
                logContainer.append(logId, logTime, logDetails)
                $logs.append(logContainer)
            }
            const codeElement = $logs.find('code');
            for (let i = 0; i < codeElement.length; i++){
                let code = codeElement[i];
                hljs.highlightBlock(code);
            }
            let docInfo = null
            if (data.docInfo){
                docInfo = data.docInfo.clone()
                // 找到docInfo中的最后一个tr
                const lastTr = docInfo.find('table tbody tr:last-child');
                lastTr.append($('<td class="key">').text('节点：'))
                lastTr.append($('<td class="value">').text(nodeName))
                $page.append(docInfo)
            }
            $page.append($logs)
            createPage("节点关键日志", $page)
        }

        function CreateNodeApiLogsPage(entry_id, entry_type, node_type, node_name, docInfo=null){
            // return
            // let loadingContainer = createLoadingContainer()
            showLoadingStatus($loadingContainer)

            axios.get('/api/v1/link_trace/node_logs',{
                params: {
                    entry_id: entry_id,
                    entry_type: entry_type,
                    node_type: node_type,
                }
            }).then(response => {
                const data = response.data.data;
                if (data.logs.length == 0){
                    Swal.fire({
                        position: "top-end",
                        icon: "error",
                        title: '无日志',
                        showConfirmButton: false,
                        timer: 1000,
                        customClass: {
                            popup: 'custom-popup',
                            title: 'custom-popup-title',
                            icon: 'custom-popup-icon',
                        }
                    });
                } else{
                    data.docInfo = docInfo
                    renderNodeApiLogs(data, node_name)
                }

            }).catch(error => {
                console.error('Error fetching merged activity data:', error);
            }).finally(() => {
                hideLoadingStatus($loadingContainer)
            });
        }

                <div class="tooltip">

                </div>

                </div>
                <div class="tooltip">
                    ${statusToString(status)}
                    <div class="tooltiptext">结果</div>
                </div>
                `).css({
                'text-align': 'center',
                'margin-top': '30px'
            })
            // 给$info中的.tooltip添加点击事件
            $info.find('.tooltip').click(function() {
                //     复制文本到剪贴板，仅取div内的一级文本，不取内部子节点的文本
                const text = $(this).contents().filter(function() {
                    return this.nodeType === Node.TEXT_NODE; // 只选择文本节点

                        }
                    });
                }).catch(function(error) {

        function CreateSingleDocTraceGraphPage(entry_id, entry_type, {userId, time, isMulti, title, status}){
            showLoadingStatus($loadingContainer)
            let $info = createDocHeaderWithTable(userId, time, isMulti, title, status, entry_id)

            axios.get('/api/v1/link_trace/single_doc', {
                params: {
                    entry_id: entry_id,
                    entry_type: entry_type,
                }
            }).then(response => {
                const data = response.data.data;
                if (!checkResponse(response.data)){
                    return
                }
                let graphData = data.link_graph
                for(let i = 0; i < graphData.nodes.length; i++){
                    graphData.nodes[i].entry_id = data.entry_id
                    graphData.nodes[i].entry_type = data.entry_type
                }

                let $page = $('<div>').addClass('page-body')
                let $svgContainer = $('<div>').addClass('svg-container')

                let $svg = createTreeDiagram(graphData, '用户上传', [], $info.clone())
                $svgContainer.append($svg)
                $page.append($info, $svgContainer)
                createPage("单文档核心链路", $page)
            }).catch(error => {
                console.error('Error fetching merged activity data:', error);
            }).finally(() => {
                hideLoadingStatus($loadingContainer)
            });
        }

        function CreateMultiDocTraceGraphPage(entry_id, {userId, time, isMulti, title, status}){

            showLoadingStatus($loadingContainer)
            let $info = createDocHeaderWithTable(userId, time, isMulti, title, status, entry_id)

            axios.get('/api/v1/link_trace/multi_doc',{
                params: {
                    multi_id: entry_id,
                }
            }).then(response => {
                const data = response.data.data;
                if (!checkResponse(response.data)){
                    return
                }
                let graphData = {
                    'nodes': [],
                    'edges': {},
                }
                let fileTypes = []
                for (const article of data.articles) {
                    fileTypes.push(entryTypeToString(article.entry_type))
                    let articleGraph = article.graph
                    for (const node of articleGraph.nodes) {
                        node.entry_id = article.entry_id
                        node.entry_type = article.entry_type
                        graphData.nodes.push(node)
                    }
                    // 遍历边: map[str, list[str]]
                    Object.keys(articleGraph.edges).forEach(function (from) {
                        graphData.edges[from] = articleGraph.edges[from]
                    })
                }
                for (const node of data.graph.nodes){
                    node.entry_id = entry_id
                    node.entry_type = EntryTypeEnum.MULTI
                }

                let $page = $('<div>').addClass('page-body')
                let $svgContainer = $('<div>').addClass('svg-container')

                // let $svg1 = createTreeDiagram(graphData, '用户上传', new Array(data.articles.length).fill('title'))
                let $svg1 = createTreeDiagram(graphData, '用户上传', fileTypes, $info.clone())
                let $svg2 = createTreeDiagram(data.graph, '预处理完成', [], $info.clone())

                $svgContainer.append($svg1, $svg2)
                $page.append($info, $svgContainer)
                createPage("多文档核心链路", $page)

            }).catch(error => {
                console.error('Error fetching merged activity data:', error);
            }).finally(() => {
                hideLoadingStatus($loadingContainer)
            });
        }

        function CreateHomePage() {

            function setTimeRange(startTime, endTime) {
                let startTimeStr = startTime.toLocaleString().replace(/\//g, '-').slice(0, 16);
                let endTimeStr = endTime.toLocaleString().replace(/\//g, '-').slice(0, 16);
                $startDatetime.val(startTimeStr);
                $endDatetime.val(endTimeStr);
            }

            let currentPage = 0;
            let hasMoreData = true;

            const pageSize = 100;

            let $page = $('<div>').addClass('page-body')
            let $table = $('<div>');

            const $buttonContainer = $('<div>').addClass('next-button-container');

            let $searchBar = $('<div>').addClass('search-bar')
            let $startDatetime = $('<input>')
                    .attr('type', 'datetime-local')
            let $endDatetime = $('<input>')
                .attr('type', 'datetime-local')

            let $query = $('<input type="text" placeholder="内容关键词,url,uid,multi-id,entry-id等">')
            let $submitBtn = $('<button>').text('查询').on('click', function () {
                currentPage = 0
                fetchData()
            })
            let $statusSelectDropdownContents = [
                // $('<div>').addClass('dropdown-content')
                //     .append(
                //         $('<div>').text('全选'),
                //         $('<div>').text('反选'),
                //     ),

                $('<div>').addClass('dropdown-content')
                    .text('✅ ' + statusToString(ActionStatusEnum.SUCCESS))
                    .attr('status', ActionStatusEnum.SUCCESS)
                    .css({'background': COLORS[ActionStatusEnum.SUCCESS]}),
                $('<div>').addClass('dropdown-content')
                    .text('✅ ' + statusToString(ActionStatusEnum.SLOW_SUCCESS))
                    .attr('status', ActionStatusEnum.SLOW_SUCCESS)
                    .css({'background': COLORS[ActionStatusEnum.SLOW_SUCCESS]}),
                $('<div>').addClass('dropdown-content')
                    .text('✅ ' + statusToString(ActionStatusEnum.SLOW_FAIL))
                    .attr('status', ActionStatusEnum.SLOW_FAIL)
                    .css({'background': COLORS[ActionStatusEnum.SLOW_FAIL]}),
                $('<div>').addClass('dropdown-content')
                    .text('✅ ' + statusToString(ActionStatusEnum.FAIL))
                    .attr('status', ActionStatusEnum.FAIL)
                    .css({'background': COLORS[ActionStatusEnum.FAIL]}),
                $('<div>').addClass('dropdown-content')
                    .text('✅ ' + statusToString(ActionStatusEnum.UNREACHED))
                    .attr('status', ActionStatusEnum.UNREACHED)
                    .css({'background': COLORS[ActionStatusEnum.UNREACHED]}),
            ]
            console.log($statusSelectDropdownContents)
            // 批量添加点击事件
            for (let i = 0; i < $statusSelectDropdownContents.length; i++) {
                $statusSelectDropdownContents[i].on('click', function () {
                    let text = $(this).text()
                    if (text[0] === '✅') {
                        text = ' ' + text.slice(1)
                    } else{
                        text = '✅' + text.slice(1)
                    }
                    $(this).text(text)
                })
            }

            $searchBar.append(
                $('<div>').addClass('params-area').append(
                    $query,
                    $('<div>').addClass('time-select').append(
                        $startDatetime,
                        $endDatetime,
                        $('<div>').addClass('timerange-btn')
                            .text('时间范围')
                            .hover(function () {
                                $(this).next().show();
                            })
                            .mouseleave(function () {
                                let $this = $(this)
                                setTimeout(function () {
                                    // 如果光标还没有hover到div上，则隐藏
                                    if (!$this.next().is(":hover")) {
                                        $this.next().hide();
                                    }
                                }, 300)
                            }),
                        $('<div>').addClass('dropdown').append(
                            $('<div>').addClass('dropdown-content').text('最近6小时').click(function () {
                                let now = new Date();
                                let startTime = new Date(now.getTime() - 6 * 60 * 60 * 1000);
                                let endTime = new Date(now.getTime());
                                setTimeRange(startTime, endTime)
                            }),
                            $('<div>').addClass('dropdown-content').text('今天').click(function () {
                                let now = new Date();
                                let startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                                let endTime = new Date(now.getTime())
                                setTimeRange(startTime, endTime)
                            }),
                            $('<div>').addClass('dropdown-content').text('昨天').click(function () {
                                let now = new Date();
                                let startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                                let endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                                setTimeRange(startTime, endTime)
                            }),
                            $('<div>').addClass('dropdown-content').text('过去7天').click(function () {
                                let now = new Date();
                                let startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7);
                                let endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                                setTimeRange(startTime, endTime)
                            }),
                        ).hover(function () {
                            $(this).show()
                        }).mouseleave(function () {
                            let $this = $(this)
                            setTimeout(function () {
                                // 如果光标还没有hover到div上，则隐藏
                                if (!$this.prev().is(":hover")) {
                                    $this.hide()
                                }
                            }, 300)

                        }),
                    ),
                    $('<div>').addClass('status-select').append(
                        $('<div>').addClass('status-btn')
                            .text('结果状态')
                            .hover(function () {
                                    $(this).next().show();
                                })
                            .mouseleave(function () {
                                let $this = $(this)
                                setTimeout(function () {
                                    // 如果光标还没有hover到div上，则隐藏
                                    if (!$this.next().is(":hover")) {
                                        $this.next().hide();
                                    }
                                }, 300)
                            }),

                        $('<div>').addClass('dropdown').append(
                            ...$statusSelectDropdownContents
                        ).hover(function () {
                            $(this).show()
                        }).mouseleave(function () {
                            let $this = $(this)
                            setTimeout(function () {
                                // 如果光标还没有hover到div上，则隐藏
                                if (!$this.prev().is(":hover")) {
                                    $this.hide()
                                }
                            }, 300)

                        }),
                    )
                ),
                $submitBtn,
            )
            function createPagination() {
                const $prevButton = $('<div>')
                    .addClass('next-button')
                    .text('上一页')
                    .prop('disabled', currentPage === 0)
                    .click(() => {
                        if (currentPage > 0) {
                            currentPage--;
                            fetchData();
                        }
                    });

                const $nextButton = $('<div>')
                    .addClass('next-button')
                    .text('下一页')
                    .prop('disabled', !hasMoreData)
                    .click(() => {
                        if (hasMoreData) {
                            currentPage++;
                            fetchData();
                        }
                    });

                $buttonContainer.append($prevButton, $nextButton);
            }

            function updateTable(data) {
                const columns = [
                    { header: '序号', value: row => row.index },
                    { header: '用户id', value: row => row.user_id },
                    { header: '时间', value: row => row.create_time},
                    { header: '产品端', value: row => row.channel},
                    { header: '行为', value: row => row.action_name},
                    { header: '标题', value: row => row.title},
                    { header: '数据类型', value: row => {
                        let ans = [];
                        let numPdf = 0;
                        let numUrl = 0;
                        row.resources.forEach(r => {
                            if (r.entry_type == EntryTypeEnum.PDF){
                                numPdf += 1
                            } else if (r.entry_type == EntryTypeEnum.WEB){
                                numUrl += 1
                            }
                            ans.push(
                                $('<a>').attr('target', '_blank').attr('href', r.url).text(entryTypeToString(r.entry_type))
                            )
                        });
                        return ans
                    }},
                    { header: '耗时（秒）', value: row => row.cost},
                    { header: '结果', value: row => statusToString(row.status),
                        clickable: row=>true, click: row=> {
                            if (row.file_types.length >= 2) {
                                CreateMultiDocTraceGraphPage(row.entry_id,{
                                    'userId': row.user_id,
                                    'time': row.create_time,
                                    'isMulti': row.file_types.length >= 2,
                                    'title': row.title,
                                    'status': row.status,
                                    'entry_id': row.entry_id,
                                })
                            } else {
                                CreateSingleDocTraceGraphPage(row.entry_id, fileTypeToEntryType(row.file_types[0]), {
                                    'userId': row.user_id,
                                    'time': row.create_time,
                                    'isMulti': row.file_types.length >= 2,
                                    'title': row.title,
                                    'status': row.status,
                                })
                            }
                        }, style: row => {
                            return {
                                'background-color': COLORS[row.status] || '#fff',
                            }
                        }
                    },
                ];

                if ($table.is(':empty')) {
                    $table = createTable({
                        data: data.rows,
                        columns: columns,
                        title: '用户行为',
                        parent: $table
                    });
                } else {
                    const $tbody = $table.find('tbody');
                    $tbody.empty();
                    data.rows.forEach(row => {
                        const $row = $('<tr>');
                        columns.forEach((column, index) => {
                            const $td = $('<td>').text(column.value(row));
                            if (index === 0) {
                                $td.addClass('sticky-column');
                            }
                            if (column.click && parseFloat(column.value(row)) != 0){
                                $td.click(() => {
                                    column.click(row)
                                })
                                $td.addClass('clickable')
                            }
                            if (column.style) {
                                $td.css(column.style(row))
                            }
                            $row.append($td);
                        });
                        $tbody.append($row);
                    });

                    $table.find('.table-title').text(`每日用户行为总结 (第 ${currentPage + 1} 页)`);
                }
            }

            function updatePagination() {
                const $prevButton = $buttonContainer.find('.next-button:first');
                const $nextButton = $buttonContainer.find('.next-button:last');

                if (currentPage === 0) {
                    $prevButton.addClass('disabled');
                } else{
                    $prevButton.removeClass('disabled');
                }
                if (!hasMoreData) {
                    $nextButton.addClass('disabled');
                } else{
                    $nextButton.removeClass('disabled');
                }
            }

            function fetchData(mute=false) {
                if (!mute){
                    showLoadingStatus($loadingContainer)
                }
                let currentPageBkp = currentPage;
                let query = $query.val()
                let startTime = $startDatetime.val().replace('T', ' ') + ':00';
                let endTime = $endDatetime.val().replace('T', ' ') + ':00';
                // 遍历$statusSelectDropdownContents
                let status = []
                for (let i = 0; i < $statusSelectDropdownContents.length; i++) {
                    let text = $statusSelectDropdownContents[i].text()
                    if (text[0] === '✅'){
                        // 获取节点的status属性
                        status.push($statusSelectDropdownContents[i].attr('status'))
                    }
                }
                status = `[${status.join(',')}]`
                axios.get('/api/v1/link_trace/user_actions', {
                    params: {
                        query: query,
                        start_time: startTime,
                        end_time: endTime,
                        status: status,
                        skip: currentPage * pageSize,
                        limit: pageSize,
                    }
                }).then(response => {
                    const data = response.data.data;
                    console.log(data)

                    // hasMoreData = data.has_next;

                    // 如果当前页码没有变化，则更新表格数据，防止收到到新数据时页码已变化
                    if (currentPageBkp !== currentPage) {
                        return
                    }
                    // 给data添加序号
                    data.rows.forEach((item, index) => {
                        item.index = index + 1 + currentPage * pageSize;
                    })
                    hasMoreData = data.has_next;
                    updateTable(data);
                    updatePagination();

                }).catch(error => {
                    console.error('Error fetching merged activity data:', error);
                }).finally(() => {
                    hideLoadingStatus($loadingContainer)
                });
            }

            let now = new Date();
            let startTime = new Date(now.getTime() - 6 * 60 * 60 * 1000);
            let endTime = new Date(now.getTime());
            setTimeRange(startTime, endTime)

            $page.append($searchBar, $table, $buttonContainer);
            fetchData()
            createPagination();

            createPage("用户行为", $page)
        }

        function main() {
            CreateHomePage()
        }

        main()
    })

</script>
