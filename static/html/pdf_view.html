<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <script src="/public/js/pdf.min.js"></script>
    <script src="/public/js/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
        }
        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div id="pdf-container"></div>

<script>
    $(document).ready(function() {
        // 获取URL中的PDF链接参数
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('file'); // 获取file参数

        if (pdfUrl) {
            const loadingTask = pdfjsLib.getDocument({
                url: pdfUrl,
            });

            loadingTask.promise.then(pdf => {
                console.log('PDF loaded');

                const numPages = pdf.numPages; // 获取页面总数
                console.log('Number of Pages: ' + numPages);

                // 循环渲染每一页
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    pdf.getPage(pageNum).then(page => {
                        console.log('Page ' + pageNum + ' loaded');

                        const scale = 1.5;
                        const viewport = page.getViewport({ scale: scale });

                        // 创建一个新的canvas元素
                        const $canvas = $('<canvas></canvas>').attr({
                            id: 'pdf-canvas-' + pageNum,
                            width: viewport.width,
                            height: viewport.height
                        });

                        // 将canvas添加到DOM中
                        $('#pdf-container').append($canvas);

                        const context = $canvas[0].getContext('2d');
                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        page.render(renderContext);
                    });
                }
            }, reason => {
                console.error(reason);
            });
        } else {
            console.error("未提供 PDF 链接");
        }
    });
</script>
</body>
</html>
