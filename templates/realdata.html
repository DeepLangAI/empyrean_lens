        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        nav a.active {
            background-color: #4CAF50;
            color: white;
        }
        /* Styles for the content area */
        body {
            padding-top: 60px; /* Add some padding to the top of the content */
        }

        .date-display {
            display: flex;
            align-items: center;
            /*justify-content: space-between;*/
            margin-bottom: 20px;
        }

        .button-group button {

            margin-right: 10px;

        .button-group button:hover {

        }

        .button-group button:disabled {
            background-color: #ccc; /* 禁用时的灰色背景 */

<body>
<nav>
    <a href="/api/log/overview" class="active">灵狗稳定性一览</a>
    <a href="/api/log/report">灵狗接口稳定性</a>
</nav>
<h1 >灵狗稳定性</h1>

<div class="container">
    <h2 id="realtime-heading">灵狗系统真实数据</h2>
    <div class="date-display">
        <div class="button-group">
            <button id="prev-day">前一天</button>
            <button id="next-day">后一天</button>
        </div>
        <h2>日期: <span id="current-date"></span></h2>
    </div>
    <div id="table-container"/>
</div>

<script>
    /**
     * 将 Date 对象转换为东八区时间字符串
     * @param {Date} date - 需要转换的 Date 对象
     * @param {string} [format='yyyy-MM-dd HH:mm:ss'] - 输出格式,可选值有:
     *                  'yyyy-MM-dd'
     *                  'yyyy-MM-dd HH:mm:ss'
     *                  'yyyy年M月d日 HH:mm:ss'
     * @returns {string} 格式化后的东八区时间字符串
     */
    function getEastAsiaTime(date, format = 'yyyy-MM-dd') {
        // 计算东八区时差
        var timeZoneOffset = 8 * 60 * 60 * 1000; // 东八区时差为 8 小时

        // 转换为东八区时间
        var localTime = date.getTime();
        var utcTime = localTime + date.getTimezoneOffset() * 60 * 1000;
        var eastAsiaTime = new Date(utcTime + timeZoneOffset);

        // 格式化输出
        return formatDate(eastAsiaTime, format);
    }

    /**
     * 格式化 Date 对象
     * @param {Date} date - 需要格式化的 Date 对象
     * @param {string} format - 输出格式
     * @returns {string} 格式化后的日期字符串
     */
    function formatDate(date, format) {
        var year = date.getFullYear();
        var month = date.getMonth() + 1;
        var day = date.getDate();
        var hour = date.getHours();
        var minute = date.getMinutes();
        var second = date.getSeconds();

        var formatMap = {
            'yyyy': year,
            'MM': month.toString().padStart(2, '0'),
            'dd': day.toString().padStart(2, '0'),
            'HH': hour.toString().padStart(2, '0'),
            'mm': minute.toString().padStart(2, '0'),
            'ss': second.toString().padStart(2, '0')
        };

        return format.replace(/yyyy|MM|dd|HH|mm|ss/g, (match) => formatMap[match]);
    }




    $(document).ready(function() {
        // let currentDay = new Date().toISOString().slice(0, 10);
        let currentDay = getEastAsiaTime(new Date())

        // 更新当天日期的显示
        $('#current-date').text(currentDay);

        function fetchAndRenderData(date) {
            // 向后端发起请求,获取指定日期的用户数据
            axios.post(`/api/v1/report/db/realdata`, {
                "date": date
            })
                .then(function(response) {
                    const userData = response.data;
                    console.log(userData)

                    // 清空表格容器
                    $('#table-container').empty();

                    // 创建表格
                    const $table = $('<table>').addClass('user-table');

                    // 创建表头
                    const $headerRow = $('<tr>');
                    ['数据类别', '数量', ''].forEach(function(columnName) {
                        $headerRow.append($('<th>').text(columnName));
                    });
                    $table.append($headerRow);

                    // 创建数据行
                    var $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("预制网页"));
                    $dataRow.append($('<td>').text(userData.prebuild_web));
                    $dataRow.append($('<td>').text('网页总数：' + userData.web).attr('rowspan', 2).css('text-align', 'left'));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("用户上传网页"));
                    $dataRow.append($('<td>').text(userData.upload_web));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("多文档中的单PDF"));
                    $dataRow.append($('<td>').text(userData.file_in_multi));
                    $dataRow.append($('<td>').text('PDF总数：' + userData.file).attr('rowspan', 2).css('text-align', 'left'));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("单PDF"));
                    $dataRow.append($('<td>').text(userData.file_in_single));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("多文档"));
                    $dataRow.append($('<td>').text(userData.multi));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("多文档主题"));
                    $dataRow.append($('<td>').text(userData.multi_by_theme));
                    $table.append($dataRow);


                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("全文速览"));
                    $dataRow.append($('<td>').text(userData.summary_abstract));
                    $dataRow.append($('<td>').text('Summary总数：' + userData.summary).attr('rowspan', 3).css('text-align', 'left'));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("智能大纲"));
                    $dataRow.append($('<td>').text(userData.summary_outline));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("关键信息"));
                    $dataRow.append($('<td>').text(userData.summary_viewpoint));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("问题"));
                    $dataRow.append($('<td>').text(userData.question));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("回答"));
                    $dataRow.append($('<td>').text(userData.answer));
                    $table.append($dataRow);

                    $dataRow = $('<tr>');
                    $dataRow.append($('<td>').text("问题推荐"));
                    $dataRow.append($('<td>').text(userData.question_recommend));
                    $table.append($dataRow);


                    // 将表格添加到容器中
                    $('#table-container').append($table);
                })
                .catch(function(error) {
                    console.log(error);
                });
        }

        function uploadNextdayButton(){
            // 如果#next-day已经是今天了，则禁用它
            // new Date().getTime()
            let day = getEastAsiaTime(new Date())
            // if (currentDay === new Date().toISOString().slice(0, 10)) {
            if (currentDay === day) {
                $('#next-day').prop('disabled', true);
            } else {
                $('#next-day').prop('disabled', false);
            }
        }

        // 初次加载时,显示当天的数据
        fetchAndRenderData(currentDay);
        uploadNextdayButton();

        // 点击"Previous Day"按钮,显示前一天的数据
        $('#prev-day').click(function() {
            const prevDay = new Date(currentDay);
            prevDay.setDate(prevDay.getDate() - 1);
            currentDay = prevDay.toISOString().slice(0, 10);
            $('#current-date').text(currentDay);
            // 禁用当前按钮
            $('#prev-day').prop('disabled', true);
            fetchAndRenderData(currentDay);
            setTimeout(function() {
                $('#prev-day').prop('disabled', false);
                uploadNextdayButton();
            }, 300)
        });

        // 点击"Next Day"按钮,显示下一天的数据
        $('#next-day').click(function() {
            const nextDay = new Date(currentDay);
            nextDay.setDate(nextDay.getDate() + 1);
            currentDay = nextDay.toISOString().slice(0, 10);
            $('#current-date').text(currentDay);
            $('#prev-day').prop('disabled', false);
            fetchAndRenderData(currentDay);
            setTimeout(function() {
                $('#next-day').prop('disabled', false);
                uploadNextdayButton();
            }, 300)
        });
    });

</script>

</body>
</html>
